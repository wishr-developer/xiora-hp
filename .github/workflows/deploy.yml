name: Deploy to ConoHa WING (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-conoha
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP Deploy (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build content (index / news / insights / products / sitemap)
        run: python3 scripts/build.py

      - name: Deploy via FTP to ConoHa WING
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            **/*.zip
            **/*.tar
            **/*.tar.gz
            **/*.rar
            **/*.7z
            **/*.bak
            **/*.log
            **/*.md
            **/README*
            **/LICENSE*
            **/.env
            **/.env.*
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/package.json
            **/package-lock.json
            **/yarn.lock
            **/pnpm-lock.yaml
            **/xiora-icon-source.png
            content/**
            scripts/**
